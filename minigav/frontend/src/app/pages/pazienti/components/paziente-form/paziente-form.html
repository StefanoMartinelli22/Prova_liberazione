<form class="patient-form" [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-field">
    <label for="nome">Nome</label>
    <input id="nome" type="text" formControlName="nome" required />
  </div>

  <div class="form-field">
    <label for="cognome">Cognome</label>
    <input id="cognome" type="text" formControlName="cognome" required />
  </div>

  <div class="form-field">
    <label for="data-nascita">Data di nascita</label>
    <input
      id="data-nascita"
      type="date"
      formControlName="data_nascita"
      required
    />
  </div>

  <div class="form-field">
    <label for="codice-fiscale">Codice fiscale</label>
    <input
      id="codice-fiscale"
      type="text"
      formControlName="codice_fiscale"
      required
    />
  </div>

  <div class="form-field">
    <label for="telefono">Telefono</label>
    <input id="telefono" type="tel" formControlName="telefono" required />
  </div>

  <button class="submit-button" type="submit" [disabled]="form.invalid">
    Salva paziente
  </button>
</form>
